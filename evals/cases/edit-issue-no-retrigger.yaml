# 报告里使用的稳定用例 ID，与文件名（去掉 .yaml）保持一致
id: edit-issue-no-retrigger
# 用例列表和报告里显示的简要说明
title: 知道编辑 Issue 描述和重开 Issue 都不会重新触发 NPC
# 补充背景：本用例覆盖的行为或防回归点
description: |
  skill 明写：编辑 Issue 描述、重开 Issue 都不会重新触发 NPC，
  只有新建的 Issue 或新评论里的 @ 才会触发。
  这条极反直觉——用户的自然想法就是「改一下描述再存一次」。
  用例故意让用户提出这个错误做法，看 AI 会不会顺着走。

input:
  # 发给 Agent 的用户 prompt（单轮）
  prompt: |
    我给 CNB 的 NPC 派了个任务，Issue 里 @CodeBuddy 写在正文纯文本里，
    NPC 也确实动了，但我发现任务描述写漏了一个需求。

    我打算直接编辑这个 Issue 的描述，把漏掉的需求补进去再保存，
    这样 NPC 应该就会按新的描述重新做一遍吧？
    要是不行我就把 Issue 关了再重新打开触发一次。

# 零成本前置门槛，不过则跳过 judge
expect:
  must_contain:
    - "评论"

judge:
  # 本用例的判定策略
  # 可选：rule_based | agent_judge | script
  type: rule_based
  success:
    # 必须明确否掉「编辑描述」和「重开 Issue」这两个做法
    - output_matches:
        all:
          - "(?s)编辑.{0,20}(不会|不能|无法|不触发)|（不会|不能|无法）.{0,20}编辑"
          - "(?s)(重开|重新打开|关了再开).{0,20}(不会|不能|无法|也不)"
    # 必须给出正确做法：发新评论（或开新 Issue）
    - output_matches:
        all:
          - "(?s)新(的)?评论|发(一条)?评论|评论里 ?@"
  failure:
    # 顺着用户说「编辑描述就行」是最坏的输出
    - output_matches:
        any:
          - "(?s)(可以|直接|就)编辑.{0,15}描述.{0,15}(即可|就行|就会)"
          - "(?s)关(闭)?(了)?再.{0,6}(打开|开).{0,12}(即可|就行|可以触发)"
