# 报告里使用的稳定用例 ID，与文件名（去掉 .yaml）保持一致
id: no-dir-history-divergence
# 用例列表和报告里显示的简要说明
title: 复用已有仓库时不指定 --dir 会历史分叉，能提前警告
# 补充背景：本用例覆盖的行为或防回归点
description: |
  bin/cnb-npc.js 里有一条运行期警告：复用已有仓库且未指定 --dir 时，
  会推送一个全新的临时目录，若远端已有提交则历史分叉导致推送失败。
  用例让用户描述这个正要踩坑的用法，看 AI 能否在动手前就拦住，
  而不是等推送失败了再解释。

input:
  # 发给 Agent 的用户 prompt（单轮）
  prompt: |
    上周我用 cnb-npc 在 npc-workspace/npc-task 这个仓库派过一次任务，
    NPC 提了 PR 我也合了，现在仓库里有十几个提交。

    今天我想在同一个仓库再派一个新任务，就直接跑：

    ```
    node bin/cnb-npc.js run "把配置项抽到单独的 config 模块"
    ```

    这样应该没问题吧？仓库都是现成的，我就不用指定别的参数了。

# 零成本前置门槛，不过则跳过 judge
expect:
  must_contain:
    - "--dir"

judge:
  # 本用例的判定策略
  # 可选：rule_based | agent_judge | script
  type: rule_based
  success:
    # 必须提前指出会有问题，并点明历史分叉 / 推送失败
    - output_matches:
        all:
          - "(?s)分叉|不相干|unrelated|冲突|推送(会)?失败"
    # 必须给出正确做法：用 --dir 指定与远端同源的目录
    - output_matches:
        all:
          - "(?s)--dir"
          - "(?s)同源|克隆|clone|本地(已有|已经).{0,10}(仓库|代码)|指向.{0,15}(代码|仓库)"
  failure:
    # 直接确认「可以这么跑」是最坏的输出。但正确回答几乎一定会以否定形式
    # 引用这句（「会失败——不是『没问题』」），纯子串或「没问题」这类词
    # 匹配会误判（引号、破折号让排除前置否定词的写法也不可靠）。
    # 这里改成匹配「肯定式处方」：明确说不用加 --dir，或让用户直接跑。
    - output_matches:
        any:
          - "(?s)(不用|不需要|无需|没必要).{0,10}(指定|加|带).{0,6}--dir"
          - "(?s)直接(这么|这样|就这么).{0,4}跑.{0,8}(就|即可|没问题)"
