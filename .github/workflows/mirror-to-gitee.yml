name: Mirror to Gitee

on:
  push:
    branches: ['*']
    tags: ['*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure Gitee repo exists
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESC: ${{ github.event.repository.description }}
        run: |
          set -euo pipefail
          REPO_API="https://gitee.com/api/v5/repos/${GITEE_USERNAME}/${REPO_NAME}"
          STATUS=$(curl -s -o /tmp/gitee_repo.json -w "%{http_code}" "${REPO_API}?access_token=${GITEE_TOKEN}")
          if [ "$STATUS" = "404" ]; then
            echo "Gitee repo not found, creating..."
            CREATE_BODY=$(jq -n --arg name "$REPO_NAME" --arg desc "$REPO_DESC" '{name: $name, description: $desc, private: false}')
            curl -s -X POST "https://gitee.com/api/v5/user/repos?access_token=${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$CREATE_BODY" \
              -o /tmp/gitee_create.json
            STATUS=$(curl -s -o /tmp/gitee_repo.json -w "%{http_code}" "${REPO_API}?access_token=${GITEE_TOKEN}")
            if [ "$STATUS" != "200" ]; then
              echo "::error::Failed to create Gitee repo"
              cat /tmp/gitee_create.json
              exit 1
            fi
            echo "Created Gitee repo: ${REPO_API}"
            sleep 3
          elif [ "$STATUS" != "200" ]; then
            echo "::error::Unexpected status checking Gitee repo: $STATUS"
            cat /tmp/gitee_repo.json
            exit 1
          else
            echo "Gitee repo exists: ${REPO_API}"
          fi

      - name: Push mirror to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/${REPO_NAME}.git" || git remote set-url gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/${REPO_NAME}.git"
          git push --mirror gitee
